onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "login"
new_cwd = "follow"

[keys]
new_workspace = "alt+n"
new_tab = "alt+t"
close_tab = "alt+w"
previous_workspace = "alt+k"
next_workspace = "alt+j"
previous_agent = "alt+h"
next_agent = "alt+l"
rename_tab = "alt+r"
switch_tab = "alt+1..9"
zoom = "alt+f"
