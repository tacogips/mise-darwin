onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "login"
new_cwd = "follow"

[keys]
new_workspace = "alt+n"
new_tab = "alt+t"
close_tab = "alt+w"
previous_workspace = "alt+k"
next_workspace = "alt+j"
previous_agent = "alt+h"
next_agent = "alt+l"
rename_tab = "alt+r"
switch_tab = "alt+1..9"
zoom = "alt+f"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent = "#80c8e0"
panel_bg = "#0e1018"
surface0 = "#14161e"
surface1 = "#171a24"
surface_dim = "#0a0c12"
overlay0 = "#586478"
overlay1 = "#8898b8"
text = "#c8d0e0"
subtext0 = "#9aa4b8"
mauve = "#b0a0d8"
green = "#90c8a0"
yellow = "#d4b878"
red = "#d0909c"
blue = "#6898b8"
teal = "#78b8b0"
peach = "#d0a888"

[ui]
agent_panel_sort = "priority"
